@if (authService.authenticated()) {

  <header class="navbar">

    <div class="container">

      <a
        routerLink="/catalog"
        class="brand"
      >
        <span class="brand-mark">C</span>

        <span class="brand-copy">
          <strong>Carvajal</strong>
          <small>Wishlist</small>
        </span>
      </a>

      <nav>

        <a
          routerLink="/catalog"
          routerLinkActive="active"
        >
          Catálogo
        </a>

        <a
          routerLink="/wishlist"
          routerLinkActive="active"
        >
          Wishlist
        </a>

        <a
          routerLink="/history"
          routerLinkActive="active"
        >
          Histórico
        </a>

        @if (authService.isAdmin()) {

          <a
            routerLink="/admin/products"
            routerLinkActive="active"
          >
            Productos
          </a>

          <a
            routerLink="/admin/roles"
            routerLinkActive="active"
          >
            Roles
          </a>

        }

      </nav>

      <div class="session">

        <div class="user-chip">

          <span class="avatar">
            {{ authService.username()?.charAt(0)?.toUpperCase() }}
          </span>

          <span class="user-data">
            <strong>{{ authService.username() }}</strong>
            <small>{{ authService.role() }}</small>
          </span>

        </div>

        <button
          type="button"
          class="logout"
          (click)="logout()"
        >
          Salir
        </button>

      </div>

    </div>

  </header>

}

<router-outlet />
